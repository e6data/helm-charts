
{{- range $namespace := .Values.debug_namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "e6data.common.labels" $ | nindent 4 }}
  name: {{ include "e6data.name" $ }}-platform-{{ $namespace }}-role
  namespace: {{ $namespace }}
rules:
  - apiGroups:
      - ""
    resources: 
      - pods/status
      - events
    verbs: 
      - get
      - list
      - watch   
  - apiGroups:
      - ""
    resources: 
      - pods/log
    verbs: 
      - get
      - list      
  - apiGroups:
      - ""
    resources:
      - services
      - pods
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - delete
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - watch
  - apiGroups:
      - "apps"
    resources:
      - deployments
      - daemonsets
      - daemonsets/status
      - deployments/status
      - replicasets
      - replicasets/status
      - deployments/scale
      - deployments/scale/status
      - deployments/patch
      - deployments/patch/status
      - deployments/rollback
    verbs:
      - get
      - list
      - watch 
      - create
      - update
      - delete  
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "e6data.common.labels" $ | nindent 4 }}
  name: {{ include "e6data.name" $ }}-platform-{{ $namespace }}-role-binding
  namespace: {{ $namespace }}
subjects:
{{- range $rbacUser := $.Values.cloud.control_plane_user }}
  - kind: User
    name: {{ $rbacUser | quote }}
{{ end }}    
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "e6data.name" $ }}-platform-{{ $namespace }}-role
{{- end }}